[package]
name = "encvol"
version = "0.1.0"
edition = "2021"
description = "Provider-neutral encrypted VPS reinstaller"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
ed25519-dalek = "2.1"
flate2 = "1.0"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
ureq = { version = "2.10", features = ["native-certs"] }
url = { version = "2.5", features = ["serde"] }
tar = "0.4"
tempfile = "3.12"

[dev-dependencies]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
