name: release

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 qemu-utils debootstrap tang jose ovmf \
            zstd cpio cryptsetup-bin lvm2 clevis clevis-luks clevis-initramfs \
            dropbear-initramfs dosfstools gdisk kexec-tools \
            iproute2 openssl openssh-client util-linux e2fsprogs tar gzip python3
          if [ ! -x /usr/libexec/tangd ] && [ -x /usr/lib/x86_64-linux-gnu/tangd ]; then
            sudo mkdir -p /usr/libexec
            sudo ln -s /usr/lib/x86_64-linux-gnu/tangd /usr/libexec/tangd
          fi
          if [ ! -x /usr/libexec/tangd-keygen ] && [ -x /usr/lib/x86_64-linux-gnu/tangd-keygen ]; then
            sudo mkdir -p /usr/libexec
            sudo ln -s /usr/lib/x86_64-linux-gnu/tangd-keygen /usr/libexec/tangd-keygen
          fi
      - name: Package release binary
        run: sudo scripts/package-release.sh --output dist/encvol
      - name: Generate checksum
        run: sudo sh -c 'cd dist && sha256sum encvol > encvol.sha256'
      - name: Upload assets to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/encvol dist/encvol.sha256 --clobber
      - name: Upload manual workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: encvol
          path: |
            dist/encvol
            dist/encvol.sha256
